name: Process Image URL

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Download and encode image
        run: |
          curl -sL "${{ github.event.inputs.image_url }}" | base64 -w 0 > base64_image.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: base64-result
          path: base64_image.txt
