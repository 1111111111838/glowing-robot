name: Process and Send Split Base64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image'
        required: true
      webhook_url:
        description: 'Webhook Endpoint URL'
        required: true

jobs:
  split-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Download Image, Encode, Split and Send
        run: |
          IMAGE_URL="${{ github.event.inputs.image_url }}"
          WEBHOOK_URL="${{ github.event.inputs.webhook_url }}"

          # 1. הורדת התמונה והמרה ל-Base64 תוך שמירה לקובץ
          curl -sL "$IMAGE_URL" | base64 -w 0 > full_base64.txt

          # 2. חישוב גודל הקובץ ונקודת החלוקה
          LEN=$(stat -c%s full_base64.txt)
          HALF=$(( (LEN + 1) / 2 ))

          # 3. פיצול הקובץ לשני חלקים שווים
          head -c $HALF full_base64.txt > part1_raw.txt
          tail -c +$((HALF + 1)) full_base64.txt > part2_raw.txt

          # 4. יצירת קבצי JSON לשליחה
          echo -n '{"part": 1, "total_parts": 2, "data": "' > payload1.json
          cat part1_raw.txt >> payload1.json
          echo -n '"}' >> payload1.json

          echo -n '{"part": 2, "total_parts": 2, "data": "' > payload2.json
          cat part2_raw.txt >> payload2.json
          echo -n '"}' >> payload2.json

          # 5. שליחת החלקים מתוך הקבצים לקבלת מהירות מירבית
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @payload1.json

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @payload2.json

          # 6. ניקוי קבצים זמניים
          rm full_base64.txt part1_raw.txt part2_raw.txt payload1.json payload2.json
