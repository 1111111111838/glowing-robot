name: Process and Send Split Base64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image'
        required: true
      webhook_url:
        description: 'Webhook Endpoint URL'
        required: true
      job_id:
        description: 'Unique Job ID'
        required: true

jobs:
  split-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Process Image and Send Parts via Python
        shell: python
        run: |
          import urllib.request
          import base64
          import json

          image_url = "${{ github.event.inputs.image_url }}"
          webhook_url = "${{ github.event.inputs.webhook_url }}"
          job_id = "${{ github.event.inputs.job_id }}"

          # הורדת התמונה מהרשת
          req = urllib.request.Request(image_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response:
              image_bytes = response.read()

          base64_str = base64.b64encode(image_bytes).decode('utf-8')

          total_len = len(base64_str)
          half_len = (total_len + 1) // 2

          part1 = base64_str[:half_len]
          part2 = base64_str[half_len:]

          def send_part(part_num, part_data):
              payload = json.dumps({
                  "job_id": job_id,
                  "part": part_num,
                  "total_parts": 2,
                  "data": part_data
              }).encode('utf-8')
              
              # הוספת User-Agent מונעת את שגיאת 403 Forbidden מול ngrok
              req = urllib.request.Request(
                  webhook_url, 
                  data=payload, 
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'Mozilla/5.0'
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  pass

          send_part(1, part1)
          send_part(2, part2)
