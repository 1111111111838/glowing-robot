name: Process and Send Split Base64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image'
        required: true
      webhook_url:
        description: 'Webhook Endpoint URL'
        required: true
      job_id:
        description: 'Unique Job ID'
        required: true
      cookies_b64:
        description: 'Canva Cookies Base64'
        required: false

jobs:
  split-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Process Image and Send Parts via Python
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import base64
          import json

          image_url = "${{ github.event.inputs.image_url }}"
          webhook_url = "${{ github.event.inputs.webhook_url }}"
          job_id = "${{ github.event.inputs.job_id }}"
          cookies_b64 = "${{ github.event.inputs.cookies_b64 }}"

          cookie_header = ""
          if cookies_b64:
              try:
                  cookie_header = base64.b64decode(cookies_b64).decode('utf-8', errors='ignore')
              except Exception as e:
                  print(f"⚠️ שגיאה בפענוח עוגיות: {e}")

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9,he;q=0.8',
              'Referer': 'https://www.canva.com/',
              'Sec-Fetch-Dest': 'image',
              'Sec-Fetch-Mode': 'no-cors',
              'Sec-Fetch-Site': 'cross-site'
          }
          
          if cookie_header:
              headers['Cookie'] = cookie_header

          try:
              req = urllib.request.Request(image_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  image_bytes = response.read()
          except urllib.error.HTTPError as e:
              print(f"❌ שגיאת HTTP בהורדת התמונה: {e.code} - {e.reason}")
              print(f"תגובת השרת: {e.read().decode('utf-8', errors='ignore')}")
              raise e
          except Exception as e:
              print(f"❌ שגיאה כללית בהורדה: {e}")
              raise e

          base64_str = base64.b64encode(image_bytes).decode('utf-8')

          total_len = len(base64_str)
          half_len = (total_len + 1) // 2

          part1 = base64_str[:half_len]
          part2 = base64_str[half_len:]

          def send_part(part_num, part_data):
              payload = json.dumps({
                  "job_id": job_id,
                  "part": part_num,
                  "total_parts": 2,
                  "data": part_data
              }).encode('utf-8')
              
              req_send = urllib.request.Request(
                  webhook_url, 
                  data=payload, 
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'Mozilla/5.0'
                  }
              )
              with urllib.request.urlopen(req_send) as resp:
                  pass

          send_part(1, part1)
          send_part(2, part2)
