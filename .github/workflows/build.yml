name: Process and Send Split Base64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image'
        required: true
      webhook_url:
        description: 'Webhook Endpoint URL'
        required: true

jobs:
  split-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Process Image and Send Parts via Python
        shell: python
        run: |
          import urllib.request
          import base64
          import json
          import sys

          image_url = "${{ github.event.inputs.image_url }}"
          webhook_url = "${{ github.event.inputs.webhook_url }}"

          print("Downloading image...")
          req = urllib.request.Request(image_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response:
              image_bytes = response.read()

          print("Encoding to Base64...")
          base64_str = base64.b64encode(image_bytes).decode('utf-8')

          # חישוב נקודת חלוקה מדויקת
          total_len = len(base64_str)
          half_len = (total_len + 1) // 2

          part1 = base64_str[:half_len]
          part2 = base64_str[half_len:]

          print(f"Total Base64 length: {total_len}. Sending Part 1 ({len(part1)}) and Part 2 ({len(part2)})...")

          def send_part(part_num, part_data):
              payload = json.dumps({
                  "part": part_num,
                  "total_parts": 2,
                  "data": part_data
              }).encode('utf-8')
              
              req = urllib.request.Request(
                  webhook_url, 
                  data=payload, 
                  headers={'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req) as resp:
                  print(f"Part {part_num} sent successfully, status: {resp.status}")

          # שליחת שני החלקים
          send_part(1, part1)
          send_part(2, part2)
          print("Done!")
