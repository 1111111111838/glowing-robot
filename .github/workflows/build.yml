name: Process and Send Split Base64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image'
        required: true
      webhook_url:
        description: 'Webhook Endpoint URL'
        required: true
      job_id:
        description: 'Unique Job ID'
        required: true
      cookies_b64:
        description: 'Canva Cookies Base64'
        required: false

jobs:
  split-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Download Image using curl and cookies file, then split and send via Python
        run: |
          # 1. פענוח עוגיות הקנבה מ-Base64 וכתיבה לקובץ פיזי cookies.txt (אם קיימות)
          if [ -n "${{ github.event.inputs.cookies_b64 }}" ]; then
              echo "${{ github.event.inputs.cookies_b64 }}" | base64 --decode > cookies.txt
          else
              touch cookies.txt
          fi

          # 2. הורדת התמונה באמצעות curl חסין הכולל מעקב הפניות (-L), שימוש בעוגיות (-b) וכותרות דפדפן
          curl -s -L -k \
            -b cookies.txt \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Referer: https://www.canva.com/" \
            "${{ github.event.inputs.image_url }}" \
            -o downloaded_image.png

          # 3. הפעלת סקריפט Python לפיצוח ל-Base64 ושליחה ל-Webhook
          python3 - << 'EOF'
          import base64
          import json
          import urllib.request

          webhook_url = "${{ github.event.inputs.webhook_url }}"
          job_id = "${{ github.event.inputs.job_id }}"

          try:
              with open("downloaded_image.png", "rb") as f:
                  image_bytes = f.read()
              
              if len(image_bytes) == 0:
                  raise Exception("הקובץ שהורד ריק או שההורדה נכשלה.")
          except Exception as e:
              print(f"❌ שגיאה בקריאת הקובץ שהורד: {e}")
              raise e

          base64_str = base64.b64encode(image_bytes).decode('utf-8')

          total_len = len(base64_str)
          half_len = (total_len + 1) // 2

          part1 = base64_str[:half_len]
          part2 = base64_str[half_len:]

          def send_part(part_num, part_data):
              payload = json.dumps({
                  "job_id": job_id,
                  "part": part_num,
                  "total_parts": 2,
                  "data": part_data
              }).encode('utf-8')
              
              req = urllib.request.Request(
                  webhook_url, 
                  data=payload, 
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'Mozilla/5.0'
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  pass

          send_part(1, part1)
          send_part(2, part2)
          print("✨ התמונה פוצלה ונשלחה בהצלחה!")
          EOF
